[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.5.0"
description = "Hierarchical memory system for AI agents with learning, reflection, and adaptation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nikos", email = "nikos@example.com"}
]
keywords = ["ai", "agents", "memory", "llm", "embeddings", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "chromadb>=0.4.0",
    "llama-cpp-python>=0.2.0",
    "hdbscan>=0.8.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
cli = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
]
sqlite-vec = [
    "sqlite-vec>=0.1",
]
all = [
    "agent-memory[dev,cli]",
]

[project.scripts]
agent-memory = "agent_memory.memory_cli:main"

[project.urls]
Homepage = "https://github.com/nvlass/agent-memory"
Documentation = "https://github.com/nvlass/agent-memory#readme"
Repository = "https://github.com/nvlass/agent-memory"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory*"]

[tool.setuptools.package-data]
agent_memory = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
